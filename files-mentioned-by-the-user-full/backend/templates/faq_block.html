<section class="shell section faq"><div class="heading"><span>الأسئلة الشائعة</span><h2>كل ما تحتاج معرفته</h2></div><details><summary>هل استخدام الأدوات مجاني؟ <b>+</b></summary><p>نعم، أدوات الإصدار الأول مجانية ولا تتطلب إنشاء حساب.</p></details><details><summary>هل تحفظون ملفاتي؟ <b>+</b></summary><p>لا. نعالج الملف لإنشاء النتيجة فقط ولا نخزنه بعد ذلك.</p></details><details><summary>هل تعمل الأدوات على الهاتف؟ <b>+</b></summary><p>نعم، صُممت الواجهة لتعمل بسلاسة على الهاتف والكمبيوتر.</p></details></section>
